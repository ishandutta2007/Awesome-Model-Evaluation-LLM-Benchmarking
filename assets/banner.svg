<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19;border-radius:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#070a14"/>
      <stop offset="100%" stop-color="#05070d"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
      50% { transform: scale(1.15) translate(20px, -10px); opacity: 0.6; }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes barRise {
      0%, 100% { height: 35px; y: 275px; }
      50% { height: 75px; y: 235px; }
    }
    @keyframes barRise2 {
      0%, 100% { height: 60px; y: 250px; }
      50% { height: 105px; y: 205px; }
    }
    @keyframes barRise3 {
      0%, 100% { height: 80px; y: 230px; }
      50% { height: 40px; y: 270px; }
    }
    @keyframes radarSweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .orb { animation: pulseOrb 8s ease-in-out infinite; transform-origin: center; }
    .stream-line { stroke-dasharray: 12 8; animation: flowLine 25s linear infinite; }
    .bar-anim-1 { animation: barRise 4s ease-in-out infinite; }
    .bar-anim-2 { animation: barRise2 5s ease-in-out infinite; }
    .bar-anim-3 { animation: barRise3 4.5s ease-in-out infinite; }
    .radar { transform-origin: 1040px 100px; animation: radarSweep 10s linear infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGrad)"/>

  <!-- Subtle Matrix/Grid Lines in Background -->
  <g stroke="#1e293b" stroke-width="0.8" opacity="0.4">
    <line x1="50" y1="0" x2="50" y2="360"/>
    <line x1="150" y1="0" x2="150" y2="360"/>
    <line x1="250" y1="0" x2="250" y2="360"/>
    <line x1="350" y1="0" x2="350" y2="360"/>
    <line x1="450" y1="0" x2="450" y2="360"/>
    <line x1="550" y1="0" x2="550" y2="360"/>
    <line x1="650" y1="0" x2="650" y2="360"/>
    <line x1="750" y1="0" x2="750" y2="360"/>
    <line x1="850" y1="0" x2="850" y2="360"/>
    <line x1="950" y1="0" x2="950" y2="360"/>
    <line x1="1050" y1="0" x2="1050" y2="360"/>
    <line x1="1150" y1="0" x2="1150" y2="360"/>

    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
  </g>

  <!-- Dynamic Glowing Ambient Orbs (strictly background) -->
  <circle cx="180" cy="120" r="140" fill="url(#glowGrad)" class="orb" />
  <circle cx="1020" cy="180" r="160" fill="url(#glowGrad)" class="orb" style="animation-delay: -3s;" />

  <!-- Animated Background Flow Data Streams -->
  <path d="M 0,290 Q 300,240 600,290 T 1200,270" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.3" class="stream-line" />
  <path d="M 0,310 Q 400,340 800,280 T 1200,320" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.25" class="stream-line" style="animation-duration: 18s;" />

  <!-- Dynamic Animated Metric Bars (Right-hand aesthetic illustration) -->
  <g opacity="0.65">
    <rect x="940" y="240" width="16" height="70" rx="4" fill="url(#barGrad)" class="bar-anim-1" />
    <rect x="970" y="210" width="16" height="100" rx="4" fill="url(#barGrad)" class="bar-anim-2" />
    <rect x="1000" y="250" width="16" height="60" rx="4" fill="url(#barGrad)" class="bar-anim-3" />
    <rect x="1030" y="220" width="16" height="90" rx="4" fill="url(#barGrad)" class="bar-anim-1" style="animation-delay:-1s;" />
    <rect x="1060" y="200" width="16" height="110" rx="4" fill="url(#barGrad)" class="bar-anim-2" style="animation-delay:-2s;" />
    <rect x="1090" y="235" width="16" height="75" rx="4" fill="url(#barGrad)" class="bar-anim-3" style="animation-delay:-1.5s;" />
    <line x1="920" y1="310" x2="1130" y2="310" stroke="#475569" stroke-width="1.5"/>
  </g>

  <!-- Dynamic Radar / Evaluation Scanner in upper right -->
  <g opacity="0.35">
    <circle cx="1040" cy="100" r="50" fill="none" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="4 4"/>
    <circle cx="1040" cy="100" r="30" fill="none" stroke="#6366f1" stroke-width="1"/>
    <circle cx="1040" cy="100" r="10" fill="#38bdf8" />
    <line x1="1040" y1="100" x2="1080" y2="70" stroke="#38bdf8" stroke-width="2" class="radar"/>
  </g>

  <!-- High-contrast Badge pill above title (Foreground) -->
  <g transform="translate(80, 52)">
    <rect width="260" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2"/>
    <circle cx="16" cy="14" r="4.5" fill="#10b981"/>
    <text x="30" y="18.5" fill="#c7d2fe" font-size="12" font-weight="600" letter-spacing="0.5">CURATED ECOSYSTEM 2026</text>
  </g>

  <!-- Main Headline Title (Crisp, High Visibility Foreground) -->
  <text x="80" y="132" fill="url(#textGrad)" font-size="44" font-weight="800" letter-spacing="-0.5" filter="url(#glow)">Awesome Model Evaluation</text>
  <text x="80" y="180" fill="#ffffff" font-size="34" font-weight="700" letter-spacing="-0.5">&amp; LLM Benchmarking</text>

  <!-- Subtitle (Foreground, legible) -->
  <text x="80" y="222" fill="#94a3b8" font-size="16" font-weight="400">
    Automated Test Suites • RAG Triad Metrics • LLM-as-a-Judge • Agent Evals • Observability
  </text>

  <!-- Metric Badges / Feature Tags -->
  <g transform="translate(80, 258)">
    <!-- Tag 1 -->
    <g transform="translate(0, 0)">
      <rect width="130" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="65" y="20" fill="#38bdf8" font-size="12.5" font-weight="600" text-anchor="middle">🎯 LLM Metrics</text>
    </g>
    <!-- Tag 2 -->
    <g transform="translate(142, 0)">
      <rect width="125" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="62" y="20" fill="#a78bfa" font-size="12.5" font-weight="600" text-anchor="middle">🔍 RAG Quality</text>
    </g>
    <!-- Tag 3 -->
    <g transform="translate(279, 0)">
      <rect width="135" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="67" y="20" fill="#34d399" font-size="12.5" font-weight="600" text-anchor="middle">🛡️ Safety &amp; Red Team</text>
    </g>
    <!-- Tag 4 -->
    <g transform="translate(426, 0)">
      <rect width="145" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="72" y="20" fill="#f472b6" font-size="12.5" font-weight="600" text-anchor="middle">⚡ Open Benchmarks</text>
    </g>
  </g>

  <!-- Subtle bottom border glow line -->
  <line x1="0" y1="358" x2="1200" y2="358" stroke="url(#textGrad)" stroke-width="2" opacity="0.6"/>
</svg>
